<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <!--
    App Check debug token for local development.
    When running on localhost the Firebase JS SDK will auto-generate a UUID
    debug token and print it to the DevTools console as:
      "App Check debug token: <UUID>"
    Copy that UUID and register it in:
      Firebase Console → App Check → Apps → (app) → Manage debug tokens
    This script block is completely inert on the production domain because
    the hostname check fails and the global is never set.
  -->
  <script>
    self.FIREBASE_APPCHECK_DEBUG_TOKEN = '83F1FC0E-7435-426F-AA65-49D4A3FEF4CA';
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="royal_frame_mvp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Royal Frame</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
